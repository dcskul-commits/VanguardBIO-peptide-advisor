name: WP06 live staging authentication smoke
on:
  push:
    branches:
      - wp04-g3-output-safety-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check wp06-live-auth-smoke.mjs
      - run: node wp06-live-auth-smoke.mjs
